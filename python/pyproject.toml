[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbknext-forge"
version = "0.1.0"
description = "Python SDK + CLI for corebrain MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sambhaji Kolate", email = "erp@sbknext.com" }]
keywords = ["mcp", "ai", "brain", "client", "corebrain", "forge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "httpx>=0.27",
    'tomli>=1.1.0; python_version < "3.11"',
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/sbknext/forge-client"
Repository = "https://github.com/sbknext/forge-client"
Issues = "https://github.com/sbknext/forge-client/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
forge = "forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
