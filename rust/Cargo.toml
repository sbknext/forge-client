[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for corebrain MCP server"
license = "MIT"
authors = ["Sambhaji Kolate <kolate.sambhaji@gmail.com>"]
repository = "https://github.com/sbknext/forge-client"
keywords = ["mcp", "ai", "brain", "corebrain", "forge"]
categories = ["api-bindings"]
readme = "README.md"

[features]
default = ["blocking"]
blocking = ["reqwest/blocking"]
async = []

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
mockito = "1.4"
tokio = { version = "1", features = ["macros", "rt"] }
